<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monda — Prototipo PI7</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#162338;font:16px Arial,sans-serif}header{height:80px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 35px;border-bottom:1px solid #d5dce8}.brand{font-size:28px;font-weight:bold;letter-spacing:-1px;color:#243c73}small,.muted{color:#596579;font-size:13px}aside{position:fixed;top:80px;bottom:0;width:220px;background:#fff;padding:26px 16px;border-right:1px solid #d5dce8}aside a{display:block;padding:13px 15px;color:#334155;text-decoration:none;border-radius:6px;margin-bottom:3px}aside a.active{background:#eaf0fc;color:#233e77;font-weight:bold}main{margin-left:220px;padding:30px 38px;max-width:1400px}h1{font-size:29px;margin:8px 0 12px}h2{font-size:19px;margin:0 0 18px}p{line-height:1.5}button,.button{border:0;background:#2f4f8a;color:white;padding:12px 18px;border-radius:5px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}button.secondary{background:#e7ecf4;color:#243c73}.card{background:white;padding:24px;border:1px solid #d5dce8;border-radius:8px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.metrics .card strong{font-size:32px;display:block;margin:10px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #a7b3c6;border-radius:4px;font:15px Arial;margin:7px 0 18px}label{font-size:14px;font-weight:bold}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #dce2ec}th{background:#f0f4fa}.tag{background:#e8f4ee;color:#245f43;padding:5px 9px;border-radius:15px;font-size:12px}.notice{background:#fff6dc;padding:12px 16px;border-left:3px solid #af8120;font-size:14px}.row{display:flex;gap:12px;align-items:center}.row>*{flex:1}.status{min-height:26px;color:#215438;margin:12px 0}.source{display:block;background:#f0f4fa;padding:12px;margin-top:12px}.foot{font-size:12px;color:#667084;margin-top:25px}.question{font-size:18px;margin:18px 0}.radio{display:block;font-weight:normal;margin:9px 0;padding:10px;background:#f3f5f9}.radio input{width:auto;margin:0 10px 0 0}button:focus,a:focus,input:focus,select:focus,textarea:focus{outline:3px solid #e3a421;outline-offset:2px}@media(max-width:800px){aside{position:static;width:auto}main{margin:0;padding:20px}.grid,.metrics{grid-template-columns:1fr}header{padding:15px}}
</style><header><div class="brand">monda <small>Plataforma educativa</small></div><div class="row"><small id="conn">En línea</small><select id="role" style="margin:0;width:145px" aria-label="Rol de demostración"><option>Docente</option><option>Estudiante</option><option>Administrador</option></select></div></header><aside id="nav"></aside><main id="main"></main><script>
const pages=[['acceso','Acceso'],['cursos','Mis cursos'],['contenidos','Contenidos'],['tutor','Tutor del curso'],['generar','Generar evaluación'],['revision','Revisar y publicar'],['resolver','Resolver evaluación'],['seguimiento','Seguimiento'],['admin','Administración'],['sync','Sincronización']];
const $=x=>document.getElementById(x); let approved=false, offline=false;
const title=(id,name,desc)=>`<small>DISEÑO PI7 · ${id}</small><h1>${name}</h1><p class="muted">${desc}</p>`;
const status=()=>'<div id="status" class="status" role="status" aria-live="polite"></div>';
const demo='<div class="foot">Prototipo interactivo de diseño. Los datos son de demostración; las acciones simulan el comportamiento y no conectan con servicios reales.</div>';
const field=(label,html)=>`<label>${label}${html}</label>`;
function render(){const p=location.hash.slice(1)||'acceso';$('nav').innerHTML=pages.map(([id,name])=>`<a href="#${id}" class="${p===id?'active':''}">${name}</a>`).join('');let h='';
if(p==='acceso')h=title('UI-01','Bienvenido a Monda','Accede a tus cursos y materiales autorizados.')+`<div class="card" style="max-width:550px"><h2>Iniciar sesión</h2><form id="login">${field('Correo institucional','<input type="email" required value="docente@demo.invalid">')}${field('Contraseña','<input type="password" required value="demostracion">')}<button>Ingresar</button> <button type="button" class="secondary" onclick="say('Si la cuenta existe, se enviará un enlace de recuperación de 15 minutos.')">Recuperar acceso</button></form>${status()}</div>`;
if(p==='cursos')h=title('UI-02','Mis cursos','Selecciona un curso para continuar.')+`<div class="grid"><div class="card"><span class="tag">Activo</span><h2 style="margin-top:20px">Introducción a Sistemas</h2><p>Materiales, tutor y evaluaciones en un mismo espacio.</p><a class="button" href="#contenidos">Abrir curso</a></div><div class="card"><h2>Perfil y acceso</h2><p>Rol: ${$('role').value}</p><p>Los permisos se verifican en cada operación.</p><button class="secondary" onclick="say('Perfil de demostración actualizado.')">Actualizar nombre</button></div></div>${status()}`;
if(p==='contenidos')h=title('UI-03','Contenidos del curso','Introducción a Sistemas · Materiales y versiones')+`<div class="card"><h2>Cargar material</h2><p class="muted">PDF o DOCX con texto extraíble · Máximo 20 MiB</p><input type="file" id="file" accept=".pdf,.docx"><button onclick="upload()">Cargar e indexar</button>${status()}</div><div class="card"><table><tr><th>Material</th><th>Versión</th><th>Estado</th><th>Acción</th></tr><tr><td>Unidad 1 — Sistemas y componentes</td><td>1</td><td><span class="tag">Indexado</span></td><td><button class="secondary" onclick="say('Vista de material de demostración: un sistema reúne componentes relacionados que actúan con un propósito.')">Consultar</button></td></tr></table></div>`;
if(p==='tutor')h=title('UI-04','Tutor del curso','Respuestas basadas en los materiales autorizados.')+`<div class="grid" style="grid-template-columns:2fr 1fr"><div class="card"><h2>Tu consulta</h2><textarea id="question" rows="3" maxlength="2000">¿Qué es un sistema?</textarea><button onclick="ask()">Consultar material</button><button class="secondary" onclick="$('question').value='Pregunta fuera del material';ask()">Probar sin evidencia</button><div id="answer"></div>${status()}</div><div class="card"><h2>Historial</h2><p class="muted">Conversación de Introducción a Sistemas</p><p>Las fuentes indican material, versión y ubicación.</p><div class="notice">Revisa las fuentes. El tutor puede equivocarse.</div></div></div>`;
if(p==='generar')h=title('UI-05','Generar evaluación','La IA prepara borradores que necesitan revisión docente.')+`<div class="card"><div class="row">${field('Tema','<input value="Sistemas y componentes">')}${field('Nivel de Bloom','<select><option>Comprender</option><option>Recordar</option><option>Aplicar</option><option>Analizar</option><option>Evaluar</option><option>Crear</option></select>')}</div><div class="row">${field('Dificultad','<select><option>Media</option><option>Baja</option><option>Alta</option></select>')}${field('Cantidad','<input type="number" min="1" max="20" value="5">')}</div><button onclick="location.hash='revision'">Generar borradores</button></div>`;
if(p==='revision')h=title('UI-06','Revisar y publicar','Evaluación de práctica · Reactivo 1 de 1')+`<div class="card"><span class="tag" id="revstatus">${approved?'Aprobado':'Borrador'}</span><p class="question">¿Qué caracteriza a un sistema?</p><p>A. Sus componentes están relacionados.</p><p>B. Sus componentes nunca interactúan.</p><p><strong>Clave docente:</strong> A</p><p><strong>Justificación:</strong> La relación entre componentes permite actuar con un propósito.</p><a class="source" href="#contenidos">Fuente: Unidad 1 · versión 1 · párrafo 2</a><div style="margin-top:18px"><button onclick="approved=true;$('revstatus').textContent='Aprobado';say('Revisión docente registrada.')">Aprobar reactivo</button> <button class="secondary" onclick="approved=false;$('revstatus').textContent='Rechazado';say('Reactivo rechazado; debe corregirse.')">Rechazar</button> <button onclick="say(approved?'Evaluación publicada. Su versión queda inmovilizada.':'No se puede publicar: falta aprobar el reactivo.')">Publicar</button></div>${status()}</div>`;
if(p==='resolver')h=title('UI-07','Resolver evaluación','Un intento · Cierre confirmado en línea')+`<div class="card"><h2>Pregunta 1</h2><p class="question">¿Qué caracteriza a un sistema?</p><label class="radio"><input type="radio" name="option" value="A">Sus componentes están relacionados.</label><label class="radio"><input type="radio" name="option" value="B">Sus componentes nunca interactúan.</label><button onclick="const a=document.querySelector('input[name=option]:checked');say(offline?'Se necesita conexión para cerrar el intento.':a?'Intento cerrado. Puntaje de demostración: '+(a.value==='A'?'20':'0')+'/20.':'Selecciona una respuesta antes de continuar.')">Finalizar intento</button>${status()}</div>`;
if(p==='seguimiento')h=title('UI-08','Seguimiento académico','Fecha de corte de demostración · Curso autorizado')+`<div class="metrics"><div class="card">Promedio<strong>12/20</strong><small>Dos intentos: 10 y 14</small></div><div class="card">Evaluaciones finalizadas<strong>2 de 3</strong><small>66,67 % al corte</small></div><div class="card">Alertas abiertas<strong>1</strong><small>Requiere revisión docente</small></div></div><div class="card"><table><tr><th>Seudónimo</th><th>Regla</th><th>Evidencia</th><th>Acción</th></tr><tr><td>EST-003</td><td>Inactividad ≥ 7 días</td><td>Última actividad hace 8 días</td><td><button onclick="say('Alerta revisada. No genera una decisión disciplinaria automática.')">Revisar</button></td></tr></table><p><button class="secondary" onclick="downloadCSV()">Exportar CSV</button></p>${status()}</div>`;
if(p==='admin')h=title('UI-09','Administración','Usuarios, parámetros y trazabilidad')+`<div class="grid"><div class="card"><h2>Configuración RAG</h2>${field('Top k','<input type="number" value="4" min="1" max="10">')}${field('Umbral de coseno','<input type="number" value="0.35" min="0" max="1" step="0.01">')}<button onclick="say($('role').value==='Administrador'?'Configuración guardada y auditada.':'403: esta acción exige rol Administrador.')">Guardar</button></div><div class="card"><h2>Usuarios y roles</h2><p>Administrador de demostración · Activo</p><button class="secondary" onclick="say('409: no es posible desactivar al último administrador activo.')">Desactivar administrador</button><p class="muted">Auditoría: actor, fecha, objeto, resultado y correlación.</p></div></div>${status()}`;
if(p==='sync')h=title('UI-10','Sincronización','Control de acciones permitidas y conflictos')+`<div class="card"><h2>Estado de conexión</h2><button class="secondary" onclick="offline=!offline;$('conn').textContent=offline?'Sin conexión':'En línea';say(offline?'Lectura y borradores disponibles. Evaluaciones requieren conexión.':'Conexión recuperada.')">Alternar conexión</button><table style="margin-top:20px"><tr><th>Acción</th><th>Estado</th><th>Tratamiento</th></tr><tr><td>Valoración de respuesta</td><td id="pending">Pendiente</td><td>Idempotencia por actionId</td></tr><tr><td>Borrador de perfil</td><td>Conflicto de versión</td><td>Conservar copia local</td></tr></table><p><button onclick="if(offline){say('Conecta antes de sincronizar.')}else{$('pending').textContent='Confirmada';say('Acción aplicada una sola vez. Los reenvíos conservan el resultado.')} ">Sincronizar</button></p>${status()}</div>`;
$('main').innerHTML=h+demo;const login=$('login');if(login)login.onsubmit=e=>{e.preventDefault();location.hash='cursos'};}
function say(t){const el=$('status');if(el)el.textContent=t}function upload(){let f=$('file').files[0];say(!f?'Selecciona un archivo.':f.size>20*1024*1024?'413: archivo demasiado grande.':!/\.(pdf|docx)$/i.test(f.name)?'415: formato no admitido.':'Versión cargada. Estado simulado: indexado.')}function ask(){const q=$('question').value.trim();if(!q)return say('Escribe una pregunta.');const yes=!q.includes('fuera');$('answer').innerHTML=yes?'<p>Un sistema es un conjunto de componentes relacionados que actúan con un propósito.</p><a class="source" href="#contenidos">Unidad 1 · versión 1 · párrafo 2</a><p><button class="secondary" onclick="say(\'Valoración útil guardada.\')">Útil</button> <button class="secondary" onclick="say(\'Valoración no útil guardada.\')">No útil</button></p>':'<p class="notice">No encuentro evidencia suficiente en los materiales de este curso.</p>';}
function downloadCSV(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['seudonimo,promedio,fecha_corte\nEST-001,12,2026-10-04\n'],{type:'text/csv'}));a.download='reporte_demostracion.csv';a.click();URL.revokeObjectURL(a.href);say('Reporte de demostración exportado.')}window.onhashchange=render;$('role').onchange=render;render();
</script></html>
