[pytest]
markers =
    cp01: Caso de prueba CP01 - docente sube PDF y lo indexa
    cp02: Caso de prueba CP02 - consulta RAG con citas sobre PDF indexado
    cp03: Caso de prueba CP03 - estudiante no puede publicar borrador de docente
    cp04: Caso de prueba CP04 - estudiante no puede acceder a admin
    cp05: Caso de prueba CP05 - nota 6.67/20 con 1 de 3 reactivos
    cp06: Caso de prueba CP06 - promedio 10 y 14 = 12, no activa alerta baja
    cp07: Caso de prueba CP07 - sincronización aplica una vez y rechaza acciones inseguras
    cp08: Caso de prueba CP08 - RNF-01 p95 <= 800 ms a 50 VU
    cp09: Caso de prueba CP09 - RNF-02 latencia RAG y RNF-08 citas
    cp10: Caso de prueba CP10 - RNF-03 pruebas negativas por rol
    cp11: Caso de prueba CP11 - D07 PostgreSQL + pgvector disponible
    cp12: Caso de prueba CP12 - RNF-07 cobertura de tests
    es05: ES05 - calificación 6.67/20 con 1 de 3 reactivos
    oe2: Indicador OE2 - cobertura de consultas respondibles e integración
    oe3: Indicador OE3 - promedio y alertas bajas
    rnf-01: RNF-01 - p95 de API transaccional
    rnf-02: RNF-02 - latencia RAG
    rnf-03: RNF-03 - pruebas negativas por rol y curso
    rnf-04: RNF-04 - disponibilidad 30 días
    rnf-05: RNF-05 - accesibilidad Lighthouse
    rnf-06: RNF-06 - puntaje SUS
    rnf-07: RNF-07 - cobertura de tests
    rnf-08: RNF-08 - precisión de citas PDF
    e2e: pruebas de extremo a extremo que requieren servicios externos
