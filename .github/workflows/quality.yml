name: backend-quality
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend
      - run: pytest -q -m "not e2e"
      - run: alembic upgrade head --sql > /tmp/monda-schema-preview.sql
      - run: python scripts/audit_evidence_references.py README.md docs/ENTREGA_1.md docs/ENTREGA_2.md --output /tmp/evidence-reference-audit.json
