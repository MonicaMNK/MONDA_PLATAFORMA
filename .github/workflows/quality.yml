name: backend-quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_entrega1.py
      - run: python scripts/check_entrega2.py
      - run: python -m compileall -q backend
      - run: pytest -q
      - run: alembic upgrade head --sql > /tmp/monda-schema-preview.sql
